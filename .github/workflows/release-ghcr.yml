name: Release images to GHCR on tag

# Builds the components this fork changes: network-gateway, coordinator and api.
# Workers (node) carry no fork changes and run from the official succinctlabs
# base image, which must be the same generation as these images (base-v2.8.4,
# SP1 6.8.1): they share a Redis artifact store whose chunked-artifact format
# changed between v2.2.0 and v2.7.2, and all sides must agree on the SP1 version.
#
# What each image carries on top of upstream:
# - gateway: the whole Mantle network gateway (bin/network-gateway).
# - coordinator: the subscriber handler leak fix and its gauges.
# - api: the Mantle QueryProofRequests extension the gateway's requester filter
#   needs (without it the gateway falls back to the unfiltered upstream list).

on:
  push:
    tags:
      - "*"
  # Lets the workflow be exercised without cutting a tag.
  workflow_dispatch:

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      SHORT_SHA: ${{ steps.meta.outputs.SHORT_SHA }}
      TAG_NAME: ${{ steps.meta.outputs.TAG_NAME }}
      MOVE_LATEST: ${{ steps.meta.outputs.MOVE_LATEST }}
    steps:
      - name: Compute short SHA and tag name
        id: meta
        run: |
          set -euo pipefail

          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          # workflow_dispatch runs have no tag; fall back to the short SHA so the
          # image is still uniquely addressable.
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/}" ]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_OUTPUT"
            # A pre-release tag (v2.8.4-admission-gate-2-rc.1) is a real tag but
            # must not move <component>-latest. Release tags carry hyphens too
            # (v2.8.4-admission-gate-1), so match the pre-release suffix only.
            case "${TAG_NAME}" in
              *-rc*|*-alpha*|*-beta*) echo "MOVE_LATEST=0" >> "$GITHUB_OUTPUT" ;;
              *) echo "MOVE_LATEST=1" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "TAG_NAME=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "MOVE_LATEST=0" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: setup
    # Stock GitHub-hosted runner. The upstream workflow asked for a runs-on.com
    # third-party AWS runner ("runner=32cpu-linux-x64"), which is Succinct's
    # integration and is not configured for this org - every tag build queued for
    # the full 24h and was cancelled without ever producing an image.
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      # One component failing must not cancel the others mid-build.
      fail-fast: false
      matrix:
        include:
          - component: gateway
            dockerfile: ./infra/Dockerfile.network-gateway
            title: sp1-cluster-network-gateway
          - component: coordinator
            dockerfile: ./infra/Dockerfile.coordinator
            title: sp1-cluster-coordinator
          - component: api
            dockerfile: ./infra/Dockerfile.api
            title: sp1-cluster-api
    steps:
      - name: Compute image tags
        id: tags
        env:
          COMPONENT: ${{ matrix.component }}
          TAG_NAME: ${{ needs.setup.outputs.TAG_NAME }}
          MOVE_LATEST: ${{ needs.setup.outputs.MOVE_LATEST }}
        run: |
          set -euo pipefail
          # GHCR requires a lowercase repository path.
          REPO="ghcr.io/${GITHUB_REPOSITORY,,}"
          # <component>-latest only ever moves on a release tag push. A manual
          # workflow_dispatch build or a pre-release tag must not repoint a tag
          # production may follow.
          {
            echo "IMAGE_TAGS<<__EOF__"
            echo "${REPO}:${COMPONENT}-${TAG_NAME}"
            if [ "${MOVE_LATEST}" = "1" ]; then
              echo "${REPO}:${COMPONENT}-latest"
            fi
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Cleanup disk space
        run: |
          df -h
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No build cache is configured on purpose. type=gha is partitioned by ref
      # and this workflow only runs on tags, so nothing ever populates a scope a
      # later tag could read - the cache would never hit. Persisting the cargo
      # target directory via actions/cache is not an option either: the GitHub
      # Actions cache is capped at 10 GB per repository and the runner only has
      # ~14 GB of free disk. Every build here is a cold build.
      - name: Build and push ${{ matrix.component }} image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.tags.outputs.IMAGE_TAGS }}
          build-args: |
            VERGEN_GIT_SHA=${{ needs.setup.outputs.SHORT_SHA }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.setup.outputs.TAG_NAME }}
            org.opencontainers.image.title=${{ matrix.title }}
          secrets: |
            private_pull_token=${{ secrets.PRIVATE_PULL_TOKEN }}
